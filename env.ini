# Configuration du serveur SMTP  

# Adresse du serveur SMTP (exemple : Gmail, Outlook, Orange, etc.)  
# Gmail : smtp.gmail.com  
# Outlook : smtp.office365.com  
# Orange : smtp.orange.fr  
SMTP_HOST= # Exemple : smtp.gmail.com 

# Adresse e-mail utilisée pour envoyer les messages
SMTP_USERNAME= # Exemple : votremail@gmail.com  

# Mot de passe ou clé d'application associée à l'adresse e-mail  
# ⚠️ Ne jamais partager ce mot de passe publiquement
SMTP_PASSWORD= # Exemple : votremotdepasse 

# Port SMTP à utiliser  
# 587 pour TLS (Gmail, Outlook)  
# 465 pour SSL (certains serveurs)
SMTP_PORT= # Exemple : 587  

